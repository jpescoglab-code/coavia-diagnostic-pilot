<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>COAVIA Basic English Diagnostic</title>
<style>
:root{--navy:#1A2B4C;--slate:#4A607A;--gold:#D97706;--bg:#f6f7f9;--line:#dfe4ea;--ok:#176b45;--bad:#b42318}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Arial,"Noto Sans KR",sans-serif;background:var(--bg);color:#182230}.wrap{max-width:820px;margin:auto;padding:24px 18px 60px}.brand{font-weight:800;letter-spacing:.14em;color:var(--navy);margin-bottom:26px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 8px 28px rgba(26,43,76,.06)}h1{font-size:34px;line-height:1.2;margin:0 0 8px;color:var(--navy)}h2{color:var(--navy)}.sub{color:var(--slate);font-size:18px}.meta{margin:22px 0;padding:14px 16px;background:#faf6ef;border-radius:12px;color:#65410b}.btn{border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:var(--navy);color:white}.secondary{background:white;border:1px solid var(--line);color:var(--navy)}.row{display:flex;gap:10px;justify-content:space-between;align-items:center}.progress{height:8px;background:#e9edf2;border-radius:10px;overflow:hidden;margin:12px 0 28px}.bar{height:100%;background:var(--gold)}.qnum{font-size:14px;color:var(--slate);font-weight:700}.question{font-size:21px;line-height:1.55;margin:8px 0 22px}.option{display:block;width:100%;text-align:left;margin:10px 0;padding:15px 16px;border:1px solid var(--line);background:white;border-radius:12px;font-size:16px;cursor:pointer}.option.selected{border:2px solid var(--navy);background:#f2f5f9}.quote{padding:14px 16px;border-left:4px solid var(--gold);background:#fafafa;margin:12px 0;white-space:pre-line}.score{font-size:52px;font-weight:800;color:var(--navy);margin:8px 0}.level{display:inline-block;background:#faf0df;color:#8b4e00;border-radius:999px;padding:7px 12px;font-weight:800}.grid{display:grid;grid-template-columns:1fr auto;gap:10px 18px;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:22px 0}.focus{padding:16px;background:#f4f7fa;border-radius:12px;margin:18px 0}.bad{color:var(--bad);font-weight:800}.ok{color:var(--ok);font-weight:800}.explain{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}.remember{background:#faf6ef;border-radius:10px;padding:12px 14px;margin-top:12px}.hidden{display:none}@media(max-width:600px){.wrap{padding:14px 12px 40px}.card{padding:20px 16px;border-radius:14px}h1{font-size:28px}.question{font-size:19px}.row.nav{align-items:stretch}.row.nav .btn{flex:1}.score{font-size:44px}}
</style>
</head><body><main class="wrap"><div class="brand">COAVIA</div><section id="app" class="card"></section></main>
<script>
const qs=[
{p:1,q:'I usually _____ coffee in the morning.',o:['drink','eat','do','make'],a:0,e:'`coffee`처럼 음료를 마실 때는 **drink**를 사용합니다.',r:'drink coffee / drink water / drink tea'},
{p:1,q:'My sister _____ in Seoul, but she works in Incheon.',o:['living','live','lives','is live'],a:2,e:'주어가 `My sister`처럼 한 사람이면 현재형 동사에 **-s**가 붙습니다.',r:'I live → She lives'},
{p:1,q:'We _____ dinner at a small restaurant last night.',o:['have','having','has','had'],a:3,e:'`last night`가 과거를 나타내므로 `have`의 과거형 **had**가 필요합니다.',r:'have dinner → had dinner'},
{p:1,q:'You look really tired. You _____ get some rest before you go out again.',o:['are','should','have','do'],a:1,e:'피곤해 보이는 사람에게 쉬라고 조언하는 상황이므로 **should + 동사원형**이 맞습니다.',r:'You should get some rest.'},
{p:1,q:'A: Where’s Dad?\nB: He’s _____ a shower right now.',o:['doing','making','getting','having'],a:3,e:'영어에서는 샤워를 한다고 할 때 **have a shower**를 사용합니다.',r:'have a shower → having a shower'},
{p:1,q:'I usually go to work _____ bus.',o:['on','with','by','at'],a:2,e:'교통수단을 말할 때 **by + 교통수단**을 사용합니다.',r:'by bus / by train / by car'},
{p:1,q:'A: What time does the movie start?\nB: _____ 7:30.',o:['At','On','For','In'],a:0,e:'정확한 시각 앞에는 **at**을 사용합니다.',r:'at 7:30 / at noon / at midnight'},
{p:1,q:'I couldn’t sleep well last night, so I’m really _____ today.',o:['tiring','busy','boring','tired'],a:3,e:'잠을 잘 못 자서 피곤한 **상태**이므로 `tired`가 맞습니다.',r:'I’m tired. / It was a tiring day.'},
{p:1,q:'A: Do you want to go out for dinner tonight?\nB: I can’t. I _____ work late tonight.',o:['should','have to','can','would'],a:1,e:'늦게까지 일해야 하는 의무·필요를 나타내므로 **have to**가 맞습니다.',r:'I have to work late.'},
{p:1,q:'I was going to walk home, _____ it started raining.',o:['because','so','but','if'],a:2,e:'걸어가려 했지만 비가 왔다는 반대 흐름이므로 **but**이 자연스럽습니다.',r:'I wanted to go, but I was too tired.'},
{p:2,q:'You’re at a café. You want a large iced coffee. What would you say?',o:['I will like a large iced coffee.','I like a large iced coffee.','I’d like a large iced coffee, please.','I am liking a large iced coffee.'],a:2,e:'카페나 식당에서 주문할 때 **I’d like...**는 자연스럽고 정중한 표현입니다.',r:'I’d like + 원하는 것, please.'},
{p:2,q:'A: Would you like some more pizza?\nB: _____ I’m full.',o:['No, thanks.','That’s right.','You’re welcome.','It doesn’t matter.'],a:0,e:'음식을 더 권유받았지만 배가 부른 상황이므로 **No, thanks.**가 자연스럽습니다.',r:'No, thanks. I’m full.'},
{p:2,q:'You’re shopping for shoes, but they are too small. What would you ask?',o:['Can you make these bigger?','Are these a big size?','Do you have these more big?','Do you have these in a bigger size?'],a:3,e:'옷이나 신발의 다른 사이즈를 찾을 때 **in a bigger size**라고 자연스럽게 말합니다.',r:'Do you have this in a bigger/smaller size?'},
{p:2,q:'A: Excuse me, how can I get to the train station?\nB: _____ It’s about five minutes from here.',o:['You should arrive there.','Go straight and turn left at the corner.','You can take the station.','The station is going straight.'],a:1,e:'역에 어떻게 가는지 묻고 있으므로 실제 **길 안내**가 되는 답이 필요합니다.',r:'go straight / turn left / turn right'},
{p:2,q:'Your friend calls and asks, “Can you talk right now?” You’re busy. What would you say?',o:['I’m afraid to talk.','I don’t talk now.','I will call again to you.','I’m busy right now. Can I call you back?'],a:3,e:'지금 통화하기 어렵고 나중에 다시 전화하겠다는 자연스러운 표현은 **call you back**입니다.',r:'call someone back = 다시 전화하다'},
{p:2,q:'A: I’m sorry I’m late. The traffic was terrible.\nB: _____ We haven’t started yet.',o:['That’s okay.','You’re welcome.','I don’t think so.','That’s too bad.'],a:0,e:'상대가 늦어서 사과했지만 아직 시작하지 않았으므로 **That’s okay.**가 자연스럽습니다.',r:'I’m sorry. → That’s okay.'},
{p:2,q:'You’re at a restaurant and want to pay. What would you say?',o:['Can you calculate this?','Can I get the check, please?','Can I check the money?','How can I finish the food?'],a:1,e:'식당에서 계산서를 요청할 때 **Can I get the check, please?**라고 할 수 있습니다.',r:'Can I get the check, please?'},
{p:2,q:'A: I’m going to Jeju this weekend.\nB: Really? _____',o:['Welcome back!','That’s too late.','Have a great trip!','Nice to meet you.'],a:2,e:'여행을 떠나는 사람에게는 **Have a great trip!**이라고 자연스럽게 인사합니다.',r:'Have a great trip! / Have a safe trip!'},
{p:2,q:'You’re looking for milk in a supermarket. You can’t find it. What would you ask an employee?',o:['Where can I look at the milk?','Where can I get the milk to?','Where should I look the milk?','Where can I find the milk?'],a:3,e:'매장에서 물건의 위치를 물을 때 **Where can I find...?**를 자주 사용합니다.',r:'Where can I find + 물건?'},
{p:2,q:'A: Do you want to have lunch together tomorrow?\nB: I’d love to, but I have a meeting at noon. _____\nA: Sure. How about Friday?',o:['Can we do another day?','What did you eat?','Where is your meeting?','Do you like lunch?'],a:0,e:'내일은 시간이 안 되므로 **다른 날로 약속을 바꾸자**는 답이 자연스럽습니다.',r:'Can we do another day?'},
{p:3,q:'You receive this message from a friend:',x:'I’m almost there. Give me five more minutes.',ask:'What does your friend mean?',o:['They can’t meet you today.','They will arrive soon.','They want to leave in five minutes.','They have been there for five minutes.'],a:1,e:'**I’m almost there.**는 거의 도착했다는 뜻입니다.',r:'I’m almost there. = 거의 다 왔어.'},
{p:3,q:'You see this sign on a store door:',x:'CLOSED TODAY\nOPEN TOMORROW AT 10 A.M.',ask:'What does it mean?',o:['The store closes at 10 today.','You can shop there today.','The store is open until tomorrow.','You can shop there tomorrow morning.'],a:3,e:'오늘은 닫혀 있고 **내일 오전 10시에 연다**는 안내입니다.',r:'CLOSED TODAY / OPEN TOMORROW AT 10 A.M.'},
{p:3,q:'A: How was the movie?\nB: It was okay, but I probably wouldn’t watch it again.',ask:'What does B mean?',o:['B thought the movie was just okay.','B thought the movie was excellent.','B wants to see it again.','B didn’t watch the movie.'],a:0,e:'`It was okay`라고 했고 다시 볼 생각은 없으므로 **그냥 괜찮았다**는 의미입니다.',r:'It was okay. = 그냥 괜찮았어.'},
{p:3,q:'You receive this message:',x:'Can we meet at 3 instead of 2? Something came up at work.',ask:'What does the person want to do?',o:['Cancel the meeting.','Meet at work.','Change the meeting time.','Meet one hour earlier.'],a:2,e:'`at 3 instead of 2`는 2시 대신 3시에 만나자는 뜻이므로 **시간 변경**입니다.',r:'A instead of B = B 대신 A'},
{p:3,q:'A restaurant has this notice:',x:'LUNCH SPECIAL\n11:30 A.M. – 2:00 P.M.\nSoup + Sandwich + Drink · $12',ask:'You arrive at 2:30 P.M. Which is true?',o:['The restaurant is closed.','The lunch special is no longer available.','All sandwiches cost $12.','Drinks are free after 2 P.M.'],a:1,e:'Lunch Special은 **2시까지**인데 도착한 시간은 2시 30분입니다.',r:'11:30 A.M. – 2:00 P.M.'},
{p:3,q:'A: Do you want me to pick you up at the airport?\nB: Thanks, but my brother is coming to get me.',ask:'What does B mean?',o:['B will take a taxi.','B wants A to come to the airport.','B’s brother needs a ride.','B doesn’t need a ride from A.'],a:3,e:'B의 형제가 이미 데리러 오기로 했기 때문에 **A가 데리러 올 필요가 없습니다.**',r:'pick someone up / come to get someone = ~를 데리러 오다'},
{p:3,q:'You ordered something online and receive this email:',x:'Your package was scheduled to arrive today, but delivery has been delayed due to bad weather. We expect it to arrive tomorrow.',ask:'What should you expect?',o:['Your package should arrive a day late.','Your order has been canceled.','You need to order the item again.','Your package arrived today.'],a:0,e:'오늘 예정이던 배송이 날씨 때문에 **내일로 지연**되었습니다.',r:'be delayed = 지연되다'},
{p:3,q:'A: Are you coming to dinner tonight?\nB: I’d like to, but I’m not sure I can get out of work on time.',ask:'What does B mean?',o:['B doesn’t want to come.','B definitely won’t come.','B may come if work finishes in time.','B has already left work.'],a:2,e:'오고 싶지만 제시간에 퇴근할 수 있을지 **확실하지 않다**는 뜻입니다.',r:'I’m not sure I can... = 할 수 있을지 모르겠어.'},
{p:3,q:'Your coworker sends you this message:',x:'I’m heading out for lunch. Do you want me to grab you anything?',ask:'What is your coworker offering to do?',o:['Help you finish your work.','Bring you something to eat.','Ask you where to eat.','Have lunch with you at work.'],a:1,e:'여기서 `grab`은 문맥상 무언가를 **사거나 가져오다**라는 일상적인 의미입니다.',r:'Do you want me to grab you anything? = 뭐 좀 사다 줄까?'},
{p:3,q:'Your hotel sends you this message:',x:'Your room will be ready by 3 P.M. You’re welcome to leave your bags with us if you arrive earlier.',ask:'You arrive at 1 P.M. What can you do?',o:['Go directly to your room.','Check out before 3 P.M.','Ask the hotel to open at 3 P.M.','Leave your luggage at the hotel.'],a:3,e:'방은 3시에 준비되지만 일찍 도착하면 **짐을 호텔에 맡길 수 있습니다.**',r:'leave your bags with us = 짐을 맡기다'}
];
let idx=0, ans=Array(qs.length).fill(null), review=[], ri=0; const app=document.querySelector('#app');
const partName=p=>p===1?'기본 문장 · 어휘':p===2?'생활영어 표현':'실제 영어 이해';
function md(s){return s.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`(.*?)`/g,'<code>$1</code>')}
function start(){app.innerHTML=`<h1>내 영어, 어느 정도일까?</h1><div class="sub">Basic English Diagnostic Test</div><p>일상에서 자주 사용하는 영어를 중심으로 나의 기본 영어 실력을 가볍게 확인해 보세요.</p><div class="meta"><b>30 Questions · About 10 Minutes</b><br><br>✓ 기본 문장과 어휘<br>✓ 실제 생활영어 표현<br>✓ 짧은 대화와 메시지 이해</div><button class="btn primary" onclick="renderQ()">진단 시작하기 →</button>`}
function renderQ(){let z=qs[idx],pct=Math.round((idx/30)*100);app.innerHTML=`<div class="row"><span class="qnum">PART ${z.p} · ${partName(z.p)}</span><span class="qnum">${idx+1} / 30</span></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div><div class="question">${z.q.replace(/\n/g,'<br>')}</div>${z.x?`<div class="quote">${z.x}</div>`:''}${z.ask?`<div class="question" style="font-size:18px">${z.ask}</div>`:''}<div>${z.o.map((v,i)=>`<button class="option ${ans[idx]===i?'selected':''}" onclick="pick(${i})"><b>${'ABCD'[i]}.</b> ${v}</button>`).join('')}</div><div class="row nav" style="margin-top:24px"><button class="btn secondary" onclick="prev()" ${idx===0?'disabled':''}>← 이전</button><button class="btn primary" onclick="next()" ${ans[idx]===null?'disabled':''}>${idx===29?'결과 보기':'다음 →'}</button></div>`}
function pick(i){ans[idx]=i;renderQ()} function prev(){if(idx>0){idx--;renderQ()}} function next(){if(ans[idx]===null)return;if(idx<29){idx++;renderQ()}else result()}
function result(){let total=0,ps=[0,0,0];qs.forEach((q,i)=>{if(ans[i]===q.a){total++;ps[q.p-1]++}});let level,title,desc;if(total<=10){level='STARTER';title='기초부터 차근차근 시작해 보세요.';desc='익숙한 단어나 표현은 이해하지만, 기본 문장과 실제 상황 표현을 함께 익히는 연습이 필요합니다.'}else if(total<=17){level='BASIC';title='기본 영어를 이해하기 시작한 단계입니다.';desc='익숙한 문장과 간단한 생활 표현은 이해할 수 있습니다. 자주 쓰는 문장을 반복해서 익혀보세요.'}else if(total<=23){level='BASIC+';title='일상 영어의 기본기가 있습니다.';desc='기본적인 문장과 생활 표현을 대체로 이해합니다. 자연스러운 표현과 문맥 이해를 조금 더 익혀보세요.'}else if(total<=27){level='INTERMEDIATE';title='생활영어를 비교적 안정적으로 이해합니다.';desc='일상적인 문장과 대화를 대부분 이해합니다. 이제 더 다양한 표현과 긴 문장으로 범위를 넓혀보세요.'}else{level='STRONG';title='기초 생활영어가 탄탄합니다.';desc='기본 문장, 생활 표현, 짧은 실용 영어를 안정적으로 이해하고 있습니다. 한 단계 높은 영어에 도전해 보세요.'}
let min=Math.min(...ps), weak=ps.indexOf(min);let focus=['기본 문장 구조와 자주 쓰는 어휘를 조금 더 다져보세요.','실제 상황에서 자연스러운 표현을 선택하는 연습을 조금 더 해보세요.','단어 하나하나보다 문장 전체가 전달하는 의미를 파악하는 연습을 해보세요.'][weak];let wrong=30-total;
app.innerHTML=`<div class="qnum">COAVIA ENGLISH CHECK-UP</div><div class="score">${total} / 30</div><span class="level">${level}</span><h2>${total===30?'Excellent!':title}</h2><p>${total===30?'모든 문제를 맞혔습니다. 이 테스트 수준의 영어는 충분히 익숙합니다.':desc}</p><div class="grid"><span>기본 문장 · 어휘</span><b>${ps[0]} / 10</b><span>생활영어 표현</span><b>${ps[1]} / 10</b><span>실제 영어 이해</span><b>${ps[2]} / 10</b></div>${total<30?`<div class="focus"><b>Focus on · ${partName(weak+1)}</b><br><br>${focus}</div><p><b>${wrong}문제를 다시 확인해 볼까요?</b></p><button class="btn primary" onclick="beginReview()">틀린 문제 확인하기 →</button> `:''}<button class="btn secondary" onclick="resetTest()">다시 풀어보기</button>`}
function beginReview(){review=qs.map((q,i)=>({q,i})).filter(x=>ans[x.i]!==x.q.a);ri=0;renderReview()}
function renderReview(){let {q:z,i}=review[ri],ua=ans[i];app.innerHTML=`<div class="row"><span class="qnum">WRONG ANSWER REVIEW</span><span class="qnum">${ri+1} / ${review.length}</span></div><h2>Q${i+1} · ${partName(z.p)}</h2><div class="question">${z.q.replace(/\n/g,'<br>')}</div>${z.x?`<div class="quote">${z.x}</div>`:''}${z.ask?`<p><b>${z.ask}</b></p>`:''}<p class="bad">Your Answer ✕</p><p>${'ABCD'[ua]}. ${z.o[ua]}</p><p class="ok">Correct Answer ✓</p><p><b>${'ABCD'[z.a]}. ${z.o[z.a]}</b></p><div class="explain"><b>핵심 포인트</b><p>${md(z.e)}</p><div class="remember"><b>Remember</b><br>${z.r}</div></div><div class="row nav" style="margin-top:24px"><button class="btn secondary" onclick="rprev()" ${ri===0?'disabled':''}>← 이전</button>${ri===review.length-1?`<button class="btn primary" onclick="result()">결과로 돌아가기</button>`:`<button class="btn primary" onclick="rnext()">다음 →</button>`}</div>`}
function rprev(){if(ri>0){ri--;renderReview()}} function rnext(){if(ri<review.length-1){ri++;renderReview()}} function resetTest(){idx=0;ans=Array(30).fill(null);review=[];ri=0;start()} start();
</script></body></html>
