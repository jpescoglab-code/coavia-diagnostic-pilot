<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172e50"><title>Basic English Diagnostic | COAVIA</title><style>/* COAVIA Unified UI — shared structural design tokens */
:root{
  --brand:#172e50;--brand-deep:#10233f;--brand-tint:#edf2f8;
  --gold:#b89354;--gold-soft:#efe5d2;--paper:#fff;--bg:#f5f6f7;
  --text:#243044;--muted:#65728a;--line:#e1e6ed;
  --good:#207048;--good-bg:#edf8f1;--bad:#af4338;--bad-bg:#fcf1ee;
  --shadow:0 16px 48px rgba(24,42,73,.09);
}
body[data-theme="quiz"]{--brand:#1f5549;--brand-deep:#143e35;--brand-tint:#eef5f1}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,'Noto Sans KR','Apple SD Gothic Neo',sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit}
.container{width:min(100% - 32px,790px);margin:36px auto 24px}
.module{overflow:hidden;border:1px solid var(--line);background:var(--paper);border-radius:18px;box-shadow:var(--shadow)}
.site-head{background:linear-gradient(118deg,var(--brand) 0%,var(--brand-deep) 100%);padding:22px 34px 20px;color:#fff;display:flex;justify-content:space-between;align-items:center;gap:24px;position:relative}
.site-head:after{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold),#ddc7a2 48%,var(--gold))}
.logo{text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:148px;line-height:1.1}
.logo-main{font-family:Georgia,serif;font-weight:700;font-size:27px;letter-spacing:.08em;color:#fff}
.logo-sub{font-size:10px;line-height:1.2;font-weight:600;letter-spacing:.02em;color:#e5d8bf;margin-top:7px}
.head-actions{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex-wrap:wrap}
.head-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:8px 13px;text-decoration:none;color:#f5f8fc;border:1px solid rgba(255,255,255,.27);border-radius:7px;font-size:12px;font-weight:700;white-space:nowrap;transition:background .15s}
.head-actions a:hover{background:rgba(255,255,255,.11)}
.head-actions a:first-child{border-color:rgba(215,191,145,.55);color:#f0ddbb}
.content{padding:35px 40px 38px;min-height:335px}
.eyebrow{color:#98743b;font-weight:800;font-size:11px;letter-spacing:.16em;text-transform:uppercase;margin-bottom:13px;display:flex;align-items:center;gap:10px}
.eyebrow:before{content:"";display:inline-block;width:20px;height:2px;background:var(--gold)}
h1{font-family:Georgia,'Noto Serif KR',serif;font-size:34px;letter-spacing:-.035em;line-height:1.32;margin:0 0 9px;color:var(--brand-deep)}
h2{font-size:21px;line-height:1.4;color:var(--brand-deep);margin:0 0 14px}
p{line-height:1.73}
.lead-en{color:var(--brand);font-family:Georgia,serif;font-size:18px;margin:0 0 16px}
.intro-desc{font-size:15px;color:#566377;line-height:1.9;max-width:600px;margin:0}
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:28px 0 27px}
.stat{padding:16px 16px 15px;background:#f8f7f3;border:1px solid #eee9dd;border-radius:10px}
.stat-label{display:block;font-size:12px;color:#7a807f;line-height:1.35;margin-bottom:8px}
.stat-value{display:block;color:var(--brand);font-size:16px;font-weight:800;letter-spacing:-.015em}
.intro-checks{border-top:1px solid var(--line);padding-top:19px;margin-bottom:24px;display:grid;gap:9px;color:#5c6878;font-size:14px}
.intro-checks div:before{content:'✓';display:inline-block;color:var(--good);font-weight:700;margin-right:10px}
.btn{border:1px solid transparent;border-radius:9px;font-weight:700;font-size:14px;line-height:1.25;min-height:46px;padding:12px 19px;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{color:#fff;background:var(--brand)}.btn.primary:hover:not(:disabled){background:var(--brand-deep)}
.btn.secondary{color:var(--brand);background:#fff;border:1px solid #ccd5e0}.btn.secondary:hover:not(:disabled){background:var(--brand-tint)}
.btn:disabled{opacity:.44;cursor:not-allowed}
.start-button{min-width:190px}
.assessment-top{display:flex;justify-content:space-between;align-items:baseline;gap:14px;margin-bottom:13px}
.assessment-name{font-weight:800;color:var(--brand);font-size:13px}
.qcounter{font-size:13px;color:#606d80;font-weight:700;font-variant-numeric:tabular-nums}
.track{height:6px;border-radius:30px;background:#e8edf2;overflow:hidden;margin-bottom:30px}
.fill{height:100%;background:var(--gold);transition:width .2s ease}
.qkicker{font-size:11px;letter-spacing:.12em;color:#997d4d;font-weight:800;margin:0 0 10px}
.question{font-family:Georgia,'Noto Serif KR',serif;font-size:22px;line-height:1.6;color:var(--brand-deep);white-space:pre-line;margin:0 0 23px}
.question-followup{font-size:17px;font-weight:700;margin:16px 0 21px;line-height:1.55;color:#34435a}
.quote{padding:18px 20px;background:#faf8f4;border-left:3px solid var(--gold);font-size:16px;line-height:1.85;white-space:pre-line;margin:-6px 0 22px;color:#3c4a5b}
.options{display:grid;gap:10px}
.option{display:flex;width:100%;align-items:center;gap:13px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:14px 16px;min-height:54px;cursor:pointer;font-size:15px;line-height:1.55;color:#2a3447;transition:border-color .12s,background .12s}
.option:hover{border-color:#b8c3d3;background:#fbfcfe}
.option.selected{border-color:var(--brand);background:var(--brand-tint);box-shadow:inset 0 0 0 .3px var(--brand)}
.letter{display:grid;place-items:center;border:1px solid #d4dae3;width:27px;height:27px;border-radius:50%;font-weight:800;font-size:12px;color:#637084;flex:0 0 27px}
.option.selected .letter{border-color:var(--brand);background:var(--brand);color:#fff}
.nav-row{border-top:1px solid var(--line);padding-top:24px;margin-top:29px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.note{font-size:12px;color:#778295;margin:15px 0 0}
.result-head{text-align:center;padding:2px 0 6px}
.result-kicker{color:#98743b;font-weight:800;font-size:11px;letter-spacing:.16em}
.score{font-family:Georgia,serif;font-size:55px;color:var(--brand);font-weight:700;line-height:1.1;margin:13px 0 8px}
.level{display:inline-flex;align-items:center;background:#f4ecd9;color:#7d5d25;border:1px solid #ecdfc4;border-radius:30px;padding:7px 13px;font-size:12px;font-weight:800;letter-spacing:.04em}
.result-title{font-size:20px;margin:19px 0 5px;color:var(--brand-deep)}
.result-desc{color:#596879;line-height:1.82;font-size:14px;margin:6px auto 0;max-width:590px}
.section-label{margin:30px 0 13px;color:var(--brand-deep);font-size:14px;font-weight:800}
.skill-rows{display:grid;gap:17px;border:1px solid var(--line);border-radius:12px;padding:19px}
.skill-line{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:13px;margin-bottom:8px;color:#4a596c}
.skill-line strong{font-size:13px;color:var(--brand);font-variant-numeric:tabular-nums}
.skill-track{height:6px;background:#edf1f3;border-radius:50px;overflow:hidden}
.skill-fill{height:100%;background:var(--brand);border-radius:50px}
.focus{padding:18px 20px;background:var(--brand-tint);border:1px solid #e3e9ef;border-radius:10px;margin-top:24px;font-size:14px;color:#45586a;line-height:1.75}
.focus b{display:block;color:var(--brand);margin-bottom:5px}
.result-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:27px;align-items:center}
.review-tag{color:#9b7c49;font-size:11px;font-weight:800;letter-spacing:.13em;margin-bottom:13px}
.review-choice{font-size:14px;line-height:1.65;margin-bottom:15px}
.review-choice strong{display:block;font-size:12px;margin-bottom:4px}
.bad{color:var(--bad)}.good{color:var(--good)}
.explain{margin-top:22px;padding:20px;background:#faf9f6;border:1px solid #ebe7db;border-left:3px solid var(--gold);border-radius:3px 10px 10px 3px;font-size:14px;line-height:1.75}
.explain-title{font-size:12px;font-weight:800;letter-spacing:.06em;color:#9a7b4d;margin-bottom:8px}
.explain p{margin:0}
.remember{margin-top:12px;border-top:1px dashed #dfd7c7;padding-top:12px;font-size:13px;line-height:1.7;color:#5b6572}
.remember b{color:var(--brand)}
.module-bottom{font-size:12px;color:#788499;display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:18px;padding:0 5px}
.module-bottom a{color:var(--brand);text-decoration:none;font-weight:700}
.module-bottom a:hover{text-decoration:underline}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
@media(max-width:620px){
 .container{width:min(100% - 20px,790px);margin:12px auto 24px}
 .module{border-radius:13px}.site-head{padding:17px 17px 18px;gap:12px;align-items:center}
 .logo{min-width:111px}.logo-main{font-size:21px}.logo-sub{font-size:9px;margin-top:5px}
 .head-actions{gap:6px}.head-actions a{font-size:10.5px;min-height:32px;padding:7px 9px}
 .content{padding:27px 19px 31px;min-height:0}h1{font-size:27px}
 .lead-en{font-size:16px}.stat-grid{gap:7px}.stat{padding:12px 9px}.stat-label{font-size:10.5px}.stat-value{font-size:13px}
 .question{font-size:19px}.quote{font-size:15px;padding:14px 15px}.option{font-size:14px;min-height:51px;padding:12px 11px}
 .nav-row .btn{flex:1}.score{font-size:48px}.module-bottom{font-size:10px}
}
@media(max-width:390px){.site-head{flex-wrap:wrap}.head-actions{width:100%;justify-content:center}.site-head .logo{margin:0 auto}.stat-grid{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}}
</style></head><body data-theme="diagnostic"><main class="container"><section class="module"><header class="site-head">
  <a class="logo" href="https://coavia.kr/" aria-label="COAVIA 홈"><span class="logo-main">COAVIA</span><span class="logo-sub">인지 기반 영어 학습</span></a>
  <nav class="head-actions" aria-label="사이트 이동"><a href="https://coavia.kr/diagnostic/">← 진단검사 목록</a><a href="https://coavia.kr/">COAVIA 홈</a></nav>
</header><div class="content" id="app" aria-live="polite"></div></section><footer class="module-bottom"><span>COAVIA · Think Better, Achieve Better.</span><a href="https://coavia.kr/diagnostic/">진단 목록으로 돌아가기</a></footer></main><script>const qs=[
{p:1,q:'I usually _____ coffee in the morning.',o:['drink','eat','do','make'],a:0,e:'`coffee`처럼 음료를 마실 때는 **drink**를 사용합니다.',r:'drink coffee / drink water / drink tea'},
{p:1,q:'My sister _____ in Seoul, but she works in Incheon.',o:['living','live','lives','is live'],a:2,e:'주어가 `My sister`처럼 한 사람이면 현재형 동사에 **-s**가 붙습니다.',r:'I live → She lives'},
{p:1,q:'We _____ dinner at a small restaurant last night.',o:['have','having','has','had'],a:3,e:'`last night`가 과거를 나타내므로 `have`의 과거형 **had**가 필요합니다.',r:'have dinner → had dinner'},
{p:1,q:'You look really tired. You _____ get some rest before you go out again.',o:['are','should','have','do'],a:1,e:'피곤해 보이는 사람에게 쉬라고 조언하는 상황이므로 **should + 동사원형**이 맞습니다.',r:'You should get some rest.'},
{p:1,q:'A: Where’s Dad?\nB: He’s _____ a shower right now.',o:['doing','making','getting','having'],a:3,e:'영어에서는 샤워를 한다고 할 때 **have a shower**를 사용합니다.',r:'have a shower → having a shower'},
{p:1,q:'I usually go to work _____ bus.',o:['on','with','by','at'],a:2,e:'교통수단을 말할 때 **by + 교통수단**을 사용합니다.',r:'by bus / by train / by car'},
{p:1,q:'A: What time does the movie start?\nB: _____ 7:30.',o:['At','On','For','In'],a:0,e:'정확한 시각 앞에는 **at**을 사용합니다.',r:'at 7:30 / at noon / at midnight'},
{p:1,q:'I couldn’t sleep well last night, so I’m really _____ today.',o:['tiring','busy','boring','tired'],a:3,e:'잠을 잘 못 자서 피곤한 **상태**이므로 `tired`가 맞습니다.',r:'I’m tired. / It was a tiring day.'},
{p:1,q:'A: Do you want to go out for dinner tonight?\nB: I can’t. I _____ work late tonight.',o:['should','have to','can','would'],a:1,e:'늦게까지 일해야 하는 의무·필요를 나타내므로 **have to**가 맞습니다.',r:'I have to work late.'},
{p:1,q:'I was going to walk home, _____ it started raining.',o:['because','so','but','if'],a:2,e:'걸어가려 했지만 비가 왔다는 반대 흐름이므로 **but**이 자연스럽습니다.',r:'I wanted to go, but I was too tired.'},
{p:2,q:'You’re at a café. You want a large iced coffee. What would you say?',o:['I will like a large iced coffee.','I like a large iced coffee.','I’d like a large iced coffee, please.','I am liking a large iced coffee.'],a:2,e:'카페나 식당에서 주문할 때 **I’d like...**는 자연스럽고 정중한 표현입니다.',r:'I’d like + 원하는 것, please.'},
{p:2,q:'A: Would you like some more pizza?\nB: _____ I’m full.',o:['No, thanks.','That’s right.','You’re welcome.','It doesn’t matter.'],a:0,e:'음식을 더 권유받았지만 배가 부른 상황이므로 **No, thanks.**가 자연스럽습니다.',r:'No, thanks. I’m full.'},
{p:2,q:'You’re shopping for shoes, but they are too small. What would you ask?',o:['Can you make these bigger?','Are these a big size?','Do you have these more big?','Do you have these in a bigger size?'],a:3,e:'옷이나 신발의 다른 사이즈를 찾을 때 **in a bigger size**라고 자연스럽게 말합니다.',r:'Do you have this in a bigger/smaller size?'},
{p:2,q:'A: Excuse me, how can I get to the train station?\nB: _____ It’s about five minutes from here.',o:['You should arrive there.','Go straight and turn left at the corner.','You can take the station.','The station is going straight.'],a:1,e:'역에 어떻게 가는지 묻고 있으므로 실제 **길 안내**가 되는 답이 필요합니다.',r:'go straight / turn left / turn right'},
{p:2,q:'Your friend calls and asks, “Can you talk right now?” You’re busy. What would you say?',o:['I’m afraid to talk.','I don’t talk now.','I will call again to you.','I’m busy right now. Can I call you back?'],a:3,e:'지금 통화하기 어렵고 나중에 다시 전화하겠다는 자연스러운 표현은 **call you back**입니다.',r:'call someone back = 다시 전화하다'},
{p:2,q:'A: I’m sorry I’m late. The traffic was terrible.\nB: _____ We haven’t started yet.',o:['That’s okay.','You’re welcome.','I don’t think so.','That’s too bad.'],a:0,e:'상대가 늦어서 사과했지만 아직 시작하지 않았으므로 **That’s okay.**가 자연스럽습니다.',r:'I’m sorry. → That’s okay.'},
{p:2,q:'You’re at a restaurant and want to pay. What would you say?',o:['Can you calculate this?','Can I get the check, please?','Can I check the money?','How can I finish the food?'],a:1,e:'식당에서 계산서를 요청할 때 **Can I get the check, please?**라고 할 수 있습니다.',r:'Can I get the check, please?'},
{p:2,q:'A: I’m going to Jeju this weekend.\nB: Really? _____',o:['Welcome back!','That’s too late.','Have a great trip!','Nice to meet you.'],a:2,e:'여행을 떠나는 사람에게는 **Have a great trip!**이라고 자연스럽게 인사합니다.',r:'Have a great trip! / Have a safe trip!'},
{p:2,q:'You’re looking for milk in a supermarket. You can’t find it. What would you ask an employee?',o:['Where can I look at the milk?','Where can I get the milk to?','Where should I look the milk?','Where can I find the milk?'],a:3,e:'매장에서 물건의 위치를 물을 때 **Where can I find...?**를 자주 사용합니다.',r:'Where can I find + 물건?'},
{p:2,q:'A: Do you want to have lunch together tomorrow?\nB: I’d love to, but I have a meeting at noon. _____\nA: Sure. How about Friday?',o:['Can we do another day?','What did you eat?','Where is your meeting?','Do you like lunch?'],a:0,e:'내일은 시간이 안 되므로 **다른 날로 약속을 바꾸자**는 답이 자연스럽습니다.',r:'Can we do another day?'},
{p:3,q:'You receive this message from a friend:',x:'I’m almost there. Give me five more minutes.',ask:'What does your friend mean?',o:['They can’t meet you today.','They will arrive soon.','They want to leave in five minutes.','They have been there for five minutes.'],a:1,e:'**I’m almost there.**는 거의 도착했다는 뜻입니다.',r:'I’m almost there. = 거의 다 왔어.'},
{p:3,q:'You see this sign on a store door:',x:'CLOSED TODAY\nOPEN TOMORROW AT 10 A.M.',ask:'What does it mean?',o:['The store closes at 10 today.','You can shop there today.','The store is open until tomorrow.','You can shop there tomorrow morning.'],a:3,e:'오늘은 닫혀 있고 **내일 오전 10시에 연다**는 안내입니다.',r:'CLOSED TODAY / OPEN TOMORROW AT 10 A.M.'},
{p:3,q:'A: How was the movie?\nB: It was okay, but I probably wouldn’t watch it again.',ask:'What does B mean?',o:['B thought the movie was just okay.','B thought the movie was excellent.','B wants to see it again.','B didn’t watch the movie.'],a:0,e:'`It was okay`라고 했고 다시 볼 생각은 없으므로 **그냥 괜찮았다**는 의미입니다.',r:'It was okay. = 그냥 괜찮았어.'},
{p:3,q:'You receive this message:',x:'Can we meet at 3 instead of 2? Something came up at work.',ask:'What does the person want to do?',o:['Cancel the meeting.','Meet at work.','Change the meeting time.','Meet one hour earlier.'],a:2,e:'`at 3 instead of 2`는 2시 대신 3시에 만나자는 뜻이므로 **시간 변경**입니다.',r:'A instead of B = B 대신 A'},
{p:3,q:'A restaurant has this notice:',x:'LUNCH SPECIAL\n11:30 A.M. – 2:00 P.M.\nSoup + Sandwich + Drink · $12',ask:'You arrive at 2:30 P.M. Which is true?',o:['The restaurant is closed.','The lunch special is no longer available.','All sandwiches cost $12.','Drinks are free after 2 P.M.'],a:1,e:'Lunch Special은 **2시까지**인데 도착한 시간은 2시 30분입니다.',r:'11:30 A.M. – 2:00 P.M.'},
{p:3,q:'A: Do you want me to pick you up at the airport?\nB: Thanks, but my brother is coming to get me.',ask:'What does B mean?',o:['B will take a taxi.','B wants A to come to the airport.','B’s brother needs a ride.','B doesn’t need a ride from A.'],a:3,e:'B의 형제가 이미 데리러 오기로 했기 때문에 **A가 데리러 올 필요가 없습니다.**',r:'pick someone up / come to get someone = ~를 데리러 오다'},
{p:3,q:'You ordered something online and receive this email:',x:'Your package was scheduled to arrive today, but delivery has been delayed due to bad weather. We expect it to arrive tomorrow.',ask:'What should you expect?',o:['Your package should arrive a day late.','Your order has been canceled.','You need to order the item again.','Your package arrived today.'],a:0,e:'오늘 예정이던 배송이 날씨 때문에 **내일로 지연**되었습니다.',r:'be delayed = 지연되다'},
{p:3,q:'A: Are you coming to dinner tonight?\nB: I’d like to, but I’m not sure I can get out of work on time.',ask:'What does B mean?',o:['B doesn’t want to come.','B definitely won’t come.','B may come if work finishes in time.','B has already left work.'],a:2,e:'오고 싶지만 제시간에 퇴근할 수 있을지 **확실하지 않다**는 뜻입니다.',r:'I’m not sure I can... = 할 수 있을지 모르겠어.'},
{p:3,q:'Your coworker sends you this message:',x:'I’m heading out for lunch. Do you want me to grab you anything?',ask:'What is your coworker offering to do?',o:['Help you finish your work.','Bring you something to eat.','Ask you where to eat.','Have lunch with you at work.'],a:1,e:'여기서 `grab`은 문맥상 무언가를 **사거나 가져오다**라는 일상적인 의미입니다.',r:'Do you want me to grab you anything? = 뭐 좀 사다 줄까?'},

];

let idx=0, ans=Array(qs.length).fill(null), review=[], ri=0;
const app=document.querySelector('#app');
const esc=(s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const line=s=>esc(s).replace(/\n/g,'<br>');
const partName=p=>p===1?'기본 문장 · 어휘':p===2?'생활영어 표현':'실제 영어 이해';
function md(s){return esc(s).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/`(.*?)`/g,'<code>$1</code>')}
function start(){
  app.innerHTML=`<div class="eyebrow">COAVIA FREE DIAGNOSTIC</div>
    <h1>내 영어, 어느 정도일까?</h1>
    <p class="lead-en">Basic English Diagnostic Test</p>
    <p class="intro-desc">일상에서 자주 사용하는 영어를 중심으로 나의 기본 영어 실력을 가볍게 확인해 보세요.</p>
    <div class="stat-grid"><div class="stat"><span class="stat-label">문항 수</span><span class="stat-value">30 Questions</span></div><div class="stat"><span class="stat-label">예상 소요 시간</span><span class="stat-value">About 10 Min.</span></div><div class="stat"><span class="stat-label">진단 영역</span><span class="stat-value">3 Sections</span></div></div>
    <div class="intro-checks"><div>기본 문장과 어휘</div><div>실제 생활영어 표현</div><div>짧은 대화와 메시지 이해</div></div>
    <button class="btn primary start-button" type="button" onclick="renderQ()">진단 시작하기&nbsp; →</button>`;
}
function renderQ(){
  const z=qs[idx],pct=Math.round((idx/qs.length)*100);
  app.innerHTML=`<div class="assessment-top"><span class="assessment-name">PART ${z.p} · ${partName(z.p)}</span><span class="qcounter">${idx+1} / ${qs.length}</span></div>
  <div class="track" role="progressbar" aria-label="검사 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><div class="fill" style="width:${pct}%"></div></div>
  <div class="qkicker">QUESTION ${String(idx+1).padStart(2,'0')}</div><div class="question">${line(z.q)}</div>
  ${z.x?`<div class="quote">${line(z.x)}</div>`:''}
  ${z.ask?`<div class="question-followup">${esc(z.ask)}</div>`:''}
  <div class="options" role="group" aria-label="답 선택">${z.o.map((v,i)=>`<button type="button" class="option ${ans[idx]===i?'selected':''}" onclick="pick(${i})" aria-pressed="${ans[idx]===i}"><span class="letter">${'ABCD'[i]}</span><span>${esc(v)}</span></button>`).join('')}</div>
  <div class="nav-row"><button class="btn secondary" type="button" onclick="prev()" ${idx===0?'disabled':''}>← 이전 문제</button>
    <button class="btn primary" type="button" onclick="next()" ${ans[idx]===null?'disabled':''}>${idx===qs.length-1?'진단 결과 보기':'다음 문제 →'}</button></div>
  <p class="note">진단검사는 마지막 문항을 마친 뒤 정답과 결과를 확인할 수 있습니다.</p>`;
}
function pick(i){ans[idx]=i;renderQ()}
function prev(){if(idx>0){idx--;renderQ()}}
function next(){if(ans[idx]===null)return;if(idx<qs.length-1){idx++;renderQ()}else result()}
function result(){
  let total=0,ps=[0,0,0];qs.forEach((q,i)=>{if(ans[i]===q.a){total++;ps[q.p-1]++}});
  let level,title,desc;
  if(total<=10){level='STARTER';title='기초부터 차근차근 시작해 보세요.';desc='익숙한 단어나 표현은 이해하지만, 기본 문장과 실제 상황 표현을 함께 익히는 연습이 필요합니다.'}
  else if(total<=17){level='BASIC';title='기본 영어를 이해하기 시작한 단계입니다.';desc='익숙한 문장과 간단한 생활 표현은 이해할 수 있습니다. 자주 쓰는 문장을 반복해서 익혀보세요.'}
  else if(total<=23){level='BASIC+';title='일상 영어의 기본기가 있습니다.';desc='기본적인 문장과 생활 표현을 대체로 이해합니다. 자연스러운 표현과 문맥 이해를 조금 더 익혀보세요.'}
  else if(total<=27){level='INTERMEDIATE';title='생활영어를 비교적 안정적으로 이해합니다.';desc='일상적인 문장과 대화를 대부분 이해합니다. 이제 더 다양한 표현과 긴 문장으로 범위를 넓혀보세요.'}
  else{level='STRONG';title='기초 생활영어가 탄탄합니다.';desc='기본 문장, 생활 표현, 짧은 실용 영어를 안정적으로 이해하고 있습니다. 한 단계 높은 영어에 도전해 보세요.'}
  const weak=ps.indexOf(Math.min(...ps));
  const focus=['기본 문장 구조와 자주 쓰는 어휘를 조금 더 다져보세요.','실제 상황에서 자연스러운 표현을 선택하는 연습을 조금 더 해보세요.','단어 하나하나보다 문장 전체가 전달하는 의미를 파악하는 연습을 해보세요.'][weak];
  const wrong=qs.length-total;
  app.innerHTML=`<div class="result-head"><div class="result-kicker">COAVIA · DIAGNOSTIC REPORT</div>
    <div class="score">${total} / ${qs.length}</div><span class="level">${level}</span>
    <h2 class="result-title">${total===qs.length?'Excellent!':title}</h2>
    <p class="result-desc">${total===qs.length?'모든 문제를 맞혔습니다. 이 테스트 수준의 영어는 충분히 익숙합니다.':desc}</p></div>
    <div class="section-label">영역별 결과</div>
    <div class="skill-rows">${ps.map((s,i)=>`<div class="skill"><div class="skill-line"><span>${partName(i+1)}</span><strong>${s} / 10</strong></div><div class="skill-track"><div class="skill-fill" style="width:${s*10}%"></div></div></div>`).join('')}</div>
    ${total<qs.length?`<div class="focus"><b>FOCUS ON · ${partName(weak+1)}</b>${focus}</div>`:''}
    <div class="result-actions">${wrong?`<button class="btn primary" type="button" onclick="beginReview()">오답 ${wrong}문항 확인하기 →</button>`:''}<button class="btn secondary" type="button" onclick="resetTest()">처음부터 다시 풀기</button></div>`;
}
function beginReview(){review=qs.map((q,i)=>({q,i})).filter(x=>ans[x.i]!==x.q.a);ri=0;if(review.length)renderReview()}
function renderReview(){
  const {q:z,i}=review[ri],ua=ans[i];
  app.innerHTML=`<div class="assessment-top"><span class="assessment-name">WRONG ANSWER REVIEW</span><span class="qcounter">${ri+1} / ${review.length}</span></div>
    <div class="track"><div class="fill" style="width:${Math.round((ri+1)/review.length*100)}%"></div></div>
    <div class="review-tag">QUESTION ${i+1} · ${partName(z.p)}</div><div class="question">${line(z.q)}</div>
    ${z.x?`<div class="quote">${line(z.x)}</div>`:''}${z.ask?`<div class="question-followup">${esc(z.ask)}</div>`:''}
    <div class="review-choice bad"><strong>선택한 답</strong>${'ABCD'[ua]}. ${esc(z.o[ua])}</div>
    <div class="review-choice good"><strong>정답</strong>${'ABCD'[z.a]}. ${esc(z.o[z.a])}</div>
    <div class="explain"><div class="explain-title">핵심 해설 · EXPLANATION</div><p>${md(z.e)}</p><div class="remember"><b>Remember</b><br>${esc(z.r)}</div></div>
    <div class="nav-row"><button type="button" class="btn secondary" onclick="rprev()" ${ri===0?'disabled':''}>← 이전 오답</button>
    <button type="button" class="btn primary" onclick="${ri===review.length-1?'result()':'rnext()'}">${ri===review.length-1?'결과로 돌아가기':'다음 오답 →'}</button></div>`;
}
function rprev(){if(ri>0){ri--;renderReview()}}
function rnext(){if(ri<review.length-1){ri++;renderReview()}}
function resetTest(){idx=0;ans=Array(qs.length).fill(null);review=[];ri=0;start()}
start();
</script></body></html>
