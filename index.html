<style>
:root {
  --bg: #EEF1F3; --paper: #FFFFFF; --ink: #16212B; --muted: #55636E; --line: #D3DADF;
  --accent: #0E6B73; --accent-weak: #DDEFF0; --on-accent: #FFFFFF;
  --ok: #1B7449; --ok-bg: #E2F3EA; --warn: #8F5400; --warn-bg: #FBEEDA; --bad: #A93229; --bad-bg: #F8E2E0;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10181E; --paper: #182229; --ink: #E6ECF0; --muted: #9DABB5; --line: #2D3B45;
    --accent: #5CC5CF; --accent-weak: #1B3A3F; --on-accent: #0B1A1D;
    --ok: #74D0A2; --ok-bg: #17352A; --warn: #EBB960; --warn-bg: #3A2D14; --bad: #F2908A; --bad-bg: #3C1E1C;
  }
}
* { box-sizing: border-box; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", "Segoe UI", sans-serif; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 20px 18px 80px; }
h1 { font-size: 1.35rem; margin: 0 0 4px; }
h2 { font-size: 1.1rem; margin: 22px 0 8px; }
p { margin: 0 0 10px; }
.sub { color: var(--muted); font-size: .92rem; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; }
.topbar { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; color: var(--muted); font-size: .92rem; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 18px; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.btn { font: inherit; border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 9px; padding: 10px 18px; cursor: pointer; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, input:focus-visible + .opt-body { outline: 3px solid var(--accent); outline-offset: 2px; }
label.field { display: block; margin: 12px 0; font-weight: 600; }
label.field input[type=text], label.field select { display: block; margin-top: 4px; font: inherit; width: 100%; max-width: 360px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
.radios label, .checks label { display: block; margin: 6px 0; font-weight: 400; cursor: pointer; }
.consent { max-height: 320px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 12px 16px; background: var(--bg); font-size: .95rem; }
.consent h3 { margin: 12px 0 4px; font-size: 1rem; }
.err { color: var(--bad); font-weight: 600; }
.grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 26px; align-items: start; }
.grid.single { grid-template-columns: minmax(0, 760px); }
.passage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 24px 26px; font-family: Georgia, "Times New Roman", serif; font-size: 1.08rem; line-height: 1.8; }
.passage p { margin: 0 0 .9em; max-width: 62ch; } .passage p:last-child { margin-bottom: 0; }
.ptitle { font-size: 1.15rem; margin: 0 0 .7em; }
.player { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.pstat { margin: 10px 0 0; min-height: 1.6em; } .pstat.bad { color: var(--bad); font-weight: 600; }
.item { padding: 4px 0 22px; border-bottom: 1px solid var(--line); margin-bottom: 20px; } .item:last-child { border-bottom: 0; }
.qhead { display: flex; gap: 14px; align-items: baseline; }
.qno { font-size: 1.6rem; font-weight: 700; color: var(--accent); min-width: 2.2ch; }
.qen { font-weight: 600; font-size: 1.04rem; }
.ind { margin-left: calc(2.2ch + 14px); }
.sent { margin: 10px 0 0 calc(2.2ch + 14px); font-family: Georgia, "Times New Roman", serif; font-size: 1.14rem; line-height: 1.7; padding: 10px 14px; background: var(--paper); border-left: 4px solid var(--accent); border-radius: 0 6px 6px 0; }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--ink); margin: 0 2px; vertical-align: -1px; }
.opts { margin: 12px 0 0 calc(2.2ch + 14px); display: grid; gap: 8px; }
.opt { display: block; position: relative; } .opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt-body { display: grid; grid-template-columns: 2rem 1fr; gap: 10px; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 11px 13px; cursor: pointer; }
.opt-body .lt { font-weight: 700; color: var(--muted); }
.opt input:checked + .opt-body { border-color: var(--accent); background: var(--accent-weak); } .opt input:checked + .opt-body .lt { color: var(--accent); }
.chips { margin: 12px 0 0 calc(2.2ch + 14px); display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.chip-w { font: inherit; font-size: 1.08rem; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 12px; cursor: pointer; }
.chip-w[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); font-weight: 600; }
.slots { margin: 12px 0 0 calc(2.2ch + 14px); min-height: 3.4rem; border: 2px dashed var(--line); border-radius: 10px; padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--paper); }
.slots .ph { color: var(--muted); padding: 0 6px; }
.pool { margin: 10px 0 0 calc(2.2ch + 14px); display: flex; flex-wrap: wrap; gap: 8px; }
.tile { font: inherit; font-size: 1.08rem; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 15px; cursor: pointer; }
.tile.used { opacity: .3; }
.segrow { margin: 12px 0 0 calc(2.2ch + 14px); display: flex; flex-wrap: wrap; gap: 8px; }
.seg-b { font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 9px 13px; cursor: pointer; text-align: left; }
.seg-b b { color: var(--muted); margin-right: 6px; } .seg-b[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); }
.seg-b[disabled] { cursor: default; }
.fixhead { margin: 14px 0 0 calc(2.2ch + 14px); font-weight: 600; }
textarea.ans { width: 100%; max-width: 640px; font: inherit; font-size: 1.1rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); min-height: 84px; }
.nav { margin-top: 18px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; font-size: .92rem; }
.unclear-list { max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; background: var(--paper); }
.unclear-list label { display: block; margin: 5px 0; cursor: pointer; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .passage, .player { position: static; padding: 18px; } .opts, .sent, .chips, .slots, .pool, .segrow, .fixhead, .ind { margin-left: 0; } }
</style>

var UNITS = [{"sec":"VOC","kind":"item","items":[{"no":1,"type":"mc","stem_en":"Choose the best word for the blank.","options":["cook","wash","write","drink"],"sentence":"My hands are dirty, so I need to ____ them."}]},{"sec":"VOC","kind":"item","items":[{"no":2,"type":"rs","stem_en":"Select the real English words.","words":["nustal","invite","plorin","vemish","usual","cavlen","almost","tremic"]}]},{"sec":"VOC","kind":"item","items":[{"no":3,"type":"mc","stem_en":"Choose the best word for the blank.","options":["common","similar","available","effective"],"sentence":"The new medicine is ____ because it stopped my headache quickly."}]},{"sec":"VOC","kind":"item","items":[{"no":4,"type":"mc","stem_en":"Choose the best word for the blank.","options":["contribute","provide","supply","offer"],"sentence":"Regular exercise can ____ to better sleep at night."}]},{"sec":"VOC","kind":"item","items":[{"no":5,"type":"rs","stem_en":"Select the real English words.","words":["brastive","presence","approval","pelmory","requirement","appropriate","clariment","principle"]}]},{"sec":"VOC","kind":"item","items":[{"no":6,"type":"mc","stem_en":"Choose the best word for the blank.","options":["repeated","supported","qualified","rejected"],"sentence":"The final sentence ____ the earlier statement by adding two limits."}]},{"sec":"GRA","kind":"item","items":[{"no":7,"type":"mc","stem_en":"Choose the correct answer.","options":["eat","eating","are eating","eats"],"sentence":"My brother ____ breakfast at home every morning."}]},{"sec":"GRA","kind":"item","items":[{"no":8,"type":"mc","stem_en":"Choose the correct answer.","options":["have seen","saw","see","am seeing"],"sentence":"I ____ that movie last Saturday, so I know the ending."}]},{"sec":"GRA","kind":"item","items":[{"no":9,"type":"mc","stem_en":"Choose the correct answer.","options":["will stay","stayed","have stayed","would stay"],"sentence":"If it rains tomorrow, we ____ at home."}]},{"sec":"GRA","kind":"item","items":[{"no":10,"type":"mc","stem_en":"Choose the correct answer.","options":["was seeing","have seen","had seen","would see"],"sentence":"Anna asked whether I ____ the message she had sent the day before."}]},{"sec":"GRA","kind":"item","items":[{"no":11,"type":"mc","stem_en":"Choose the correct answer.","options":["making","to make","to making","make"],"sentence":"The new system is expected ____ the process easier for everyone."}]},{"sec":"GRA","kind":"item","items":[{"no":12,"type":"mc","stem_en":"Choose the correct answer.","options":["are","have","has","is"],"sentence":"The quality of the materials in these shoes ____ excellent."}]},{"sec":"REA","kind":"passage","id":"R-P1","text":"Library Notice\n\nThe school library will close early this Friday. There is a teachers' meeting. You can use the library from 8:30 a.m. to 3:00 p.m. Please bring back your books before 3:00 p.m. The study room will close at 3:00 p.m., too. The library will open again on Monday at 8:30 a.m. You can still use the library website.","items":[{"no":13,"type":"mc","stem_en":"What is this notice about?","options":["A library event","A change in library hours","How to use the library website","A teachers' meeting"]},{"no":14,"type":"mc","stem_en":"When will the library open again?","options":["Friday at 3:00 p.m.","Friday at 8:30 a.m.","Monday at 8:30 a.m.","Monday at 3:00 p.m."]}]},{"sec":"REA","kind":"passage","id":"R-P2","text":"Dear volunteers,\n\nThank you for signing up for our park clean-up this Saturday. The weather report says heavy rain is likely in the morning, so we have changed the starting time from 9:00 a.m. to 1:00 p.m. We will still meet at the main gate of Green Park. Please bring a water bottle and wear old clothes and comfortable shoes. Gloves and trash bags will be provided. If the rain continues into the afternoon, the event will not happen, and we will send everyone a message by 11:00 a.m. We hope the new time will allow more people to join us.","items":[{"no":15,"type":"mc","stem_en":"What is the main purpose of this email?","options":["To tell volunteers about a change to the event","To ask volunteers to bring more cleaning supplies","To invite volunteers to a different park event","To explain why Green Park needs more volunteers"]},{"no":16,"type":"mc","stem_en":"Which statement is NOT true according to the email?","options":["The event will now start at 1:00 p.m.","Volunteers will meet at Green Park's main gate.","Volunteers should bring water and wear comfortable shoes.","Everyone will get a message after 1:00 p.m."]}]},{"sec":"REA","kind":"passage","id":"R-P3","text":"School Roof Garden Finds More Uses\n\nLast spring, Westfield Secondary School turned part of an empty roof into a small garden. The project began because science teachers wanted students to study plants outside the classroom. So the school built six large plant boxes and a simple watering system. At first, only two classes used the garden, but interest grew after students shared photos and short reports on the school website. By autumn, students from the cooking club were growing plants for cooking there, and an art class was using the space to draw plants. The garden also became a meeting place at lunch, although students still need a teacher to be present. This year, the school plans to add more plant boxes because several groups have asked to use the space. However, the school will not open the roof to everyone at all times; teachers say the area is small and safety rules must still be followed. The school is now considering whether similar projects could work in other empty areas.","items":[{"no":17,"type":"mc","stem_en":"Why does the school plan to add more plant boxes this year?","options":["Several groups have asked to use the garden.","Teachers want fewer students to use the roof.","The cooking club needs more space than the art class.","Students have complained about the garden on the website."]},{"no":18,"type":"mc","stem_en":"What can most reasonably be inferred about the roof garden?","options":["The garden can support every subject taught at the school.","The school plans to remove most rules for using the roof.","The garden is popular, but access to it is still limited.","The school has already created similar gardens in other areas."]}]},{"sec":"REA","kind":"passage","id":"R-P4","text":"When More Choice Becomes Less Helpful\n\nPeople often think that having more choices makes a decision easier because it gives them a better chance of finding exactly what they want. That is sometimes true, especially when the options are clearly different and the decision is simple. However, a long list of similar choices can create a different problem: people may spend more time comparing small differences than deciding what actually matters to them.\n\nImagine a student choosing an online course from a list of thirty classes that all cover nearly the same topic. The student may begin by comparing useful points such as price, schedule, and course level. After a while, though, attention may move to small details, such as the color of a website or the exact length of each video. The extra choices have not necessarily improved the decision; instead, they have added more information that the student must sort through. This example shows why more options can sometimes make a simple choice feel harder.\n\nStill, the answer is not to remove choice completely. A smaller set of well-organized options can help people compare important differences without feeling that they must examine everything. For that reason, the most useful system may be one that offers enough variety for different needs while also helping people focus on the few differences that matter most.","items":[{"no":19,"type":"mc","stem_en":"What is the main function of the second paragraph?","options":["To show that having many choices usually leads to better decisions","To show how extra options can make a simple decision harder","To explain which details students should compare before choosing a course","To describe why online courses often have similar prices and schedules"]},{"no":20,"type":"mc","stem_en":"Which conclusion is best supported by both the first and third paragraphs?","options":["A smaller set is useful because people can compare more minor details.","Similar choices become easier when people spend more time comparing them.","Organizing choices mainly helps people who already know what they want.","A larger set may still work when choices are organized around key differences."]}]},{"sec":"LIS","kind":"clip","id":"L-C1","tts":"Hello, art club students. Today's meeting is in a new place. It is not in Room twelve. Another class is using that room. Please come to the school library at four fifteen. Bring a pen. The meeting ends at five o'clock. Your parents can wait outside the library.","plays":1,"items":[{"no":21,"type":"mc","stem_en":"What is this message about?","options":["A new school library","A meeting for parents","An art class in Room 12","A change to an art club meeting"]},{"no":22,"type":"mc","stem_en":"What time should students come to the library?","options":["4:00 p.m.","4:15 p.m.","5:00 p.m.","5:15 p.m."]}]},{"sec":"LIS","kind":"clip","id":"L-C2","tts":"Good afternoon, everyone. This is an update about Saturday's school book fair. The fair will still take place in the main hall. Doors open at one thirty in the afternoon, so visitors can look around before the first talk. The guest speaker's talk was planned for two o'clock, but now it starts at two thirty. The speaker needs extra travel time because her train is late. The used-book sale begins at three o'clock as planned. Please bring cash because some tables cannot accept cards. Students helping at the fair should meet at the front desk. Please check the school website tonight for any further updates.","plays":1,"items":[{"no":23,"type":"mc","stem_en":"What is the main purpose of this announcement?","options":["To announce a change to the book fair","To invite students to sell books","To explain how to pay by card","To describe the guest speaker's books"]},{"no":24,"type":"mc","stem_en":"What time will the guest speaker's talk start?","options":["1:30 p.m.","2:00 p.m.","2:30 p.m.","3:00 p.m."]}]},{"sec":"LIS","kind":"dict","id":"D-1","tts":"The concert has moved indoors because heavy rain continues.","plays":2,"items":[{"no":25,"type":"dict","stem_en":"Listen and type the sentence you hear."}]},{"sec":"LIS","kind":"clip","id":"L-C3","tts":"People often make long task lists because writing everything down feels organized. I’d suggest a different approach: choose three tasks that matter most, and leave the rest for later. For example, imagine a student preparing for a busy evening. She needs to finish a report, answer several messages, buy groceries, and clean her room. She chooses the report, the groceries, and one important message as her priorities. Surprisingly, the shorter list helps her start sooner because she does not keep deciding what to do next. After those tasks are done, she checks the longer list again. However, a short list is not perfect for every day. An unexpected problem may appear, or one task may take much longer than expected. That said, I would not treat the rule of three tasks as strict. It is better used as a flexible guide that helps you focus while still allowing plans to change.","plays":1,"items":[{"no":26,"type":"mc","stem_en":"What does the student do after finishing her three main tasks?","options":["Goes back to her longer list","Cleans her room next","Buys the groceries first","Answers several messages"]},{"no":27,"type":"mc","stem_en":"What is the speaker's view of this method?","options":["It should be followed every single day","It only works if nothing goes wrong","It is helpful, but not always suitable","It is mainly useful for students"]}]},{"sec":"LIS","kind":"dict","id":"D-2","tts":"The sample, which was tested carefully, remained stable after transport.","plays":2,"items":[{"no":28,"type":"dict","stem_en":"Listen and type the sentence you hear."}]},{"sec":"SB","kind":"item","items":[{"no":29,"type":"order","stem_en":"Put the words in the correct order.","tiles":["blue","She","jacket.","wearing","a","is"]}]},{"sec":"SB","kind":"item","items":[{"no":30,"type":"order","stem_en":"Put the words in the correct order.","tiles":["take?","the","does","ride","How","train","long"]}]},{"sec":"SB","kind":"item","items":[{"no":31,"type":"order","stem_en":"Put the words in the correct order.","tiles":["the","without","Although","difficulty.","wet,","road","bus","arrived","was","the"]}]},{"sec":"SB","kind":"item","items":[{"no":32,"type":"order","stem_en":"Put the words in the correct order.","tiles":["agree","Only","the","sign","after","she","to","did","checking","details","form.","the"]}]},{"sec":"SB","kind":"item","items":[{"no":33,"type":"err","stem_en":"Find the mistake.","fix_stem_en":"Choose the correct fix.","segments":[{"label":"A","text":"For 2023,"},{"label":"B","text":"my sister has worked"},{"label":"C","text":"at the same hotel"},{"label":"D","text":"and still enjoys it."}],"fix_options":[{"label":"A","text":"During 2023,"},{"label":"B","text":"Until 2023,"},{"label":"C","text":"Before 2023,"},{"label":"D","text":"Since 2023,"}]}]},{"sec":"SB","kind":"item","items":[{"no":34,"type":"err","stem_en":"Find the mistake.","fix_stem_en":"Choose the correct fix.","segments":[{"label":"A","text":"The class teaches students"},{"label":"B","text":"how to set goals,"},{"label":"C","text":"solve problems, and communicating clearly"},{"label":"D","text":"during group work."}],"fix_options":[{"label":"A","text":"solving problems, and communicate clearly"},{"label":"B","text":"solve problems, and communicate clearly"},{"label":"C","text":"solve problems, and communicated clearly"},{"label":"D","text":"solve problems, and communicating clearly"}]}]}];

  var h = progressHtml();
  var left = '';
  if (u.kind === 'passage') left = passageHtml(u);
  else if (u.kind === 'clip') left = playerHtml(u.id, u.tts, u.plays, '듣기 (재생 ' + u.plays + '회)');
  else if (u.kind === 'dict') left = playerHtml(u.id, u.tts, u.plays, '받아쓰기 (재생 ' + u.plays + '회)');
  h += '<div class="grid' + (left ? '' : ' single') + '">' + left + '<div>' + u.items.map(itemHtml).join('') + '<div class="nav"><button class="btn primary" data-act="next">' + (S.pos >= FLOW.length - 1 ? '마치기' : '다음') + '</button></div></div></div>';
  return h;
}
function renderUnclear() {
  var h = '<h1>마지막 질문</h1><div class="card"><p>이해하기 어려웠던 <b>질문(문제에 적힌 영어 지시문)</b>이 있으면 번호를 골라 주세요. 없으면 그대로 제출하세요. 이 답은 점수에 영향을 주지 않습니다.</p><div class="unclear-list">';
  Object.keys(ITEMS).map(Number).sort(function (a, b) { return a - b; }).forEach(function (no) { var it = ITEMS[no]; h += '<label><input type="checkbox" data-act="unc" data-no="' + no + '"' + (S.unclear.indexOf(no) >= 0 ? ' checked' : '') + '> ' + no + '. ' + esc(it.stem_en) + '</label>'; });
  return h + '</div><div class="nav"><button class="btn primary" data-act="finish"' + (finishing ? ' disabled' : '') + '>제출하기</button></div></div>';
}
function renderDone() {
  var h = '<h1>수고했습니다!</h1><div class="card"><p>시험이 끝났습니다. 결과는 선생님이 확인한 뒤 알려 줍니다.</p>';
  if (TEACHER) { h += '<p class="sub">[교사 확인용] 전송 상태: ' + esc(sendStatus || '없음') + '</p><div class="nav"><button class="btn" data-act="backup">응답 백업 파일 내려받기</button></div>'; }
  else if (sendStatus && sendStatus.indexOf('완료') !== 0) h += '<p class="sub">전송이 완료되지 않았을 수 있습니다. 선생님께 알려 주세요.</p>';
  return h + '</div>';
}
function render() {
  var app = document.getElementById('app'), h = '';
  if (resumeOffer) h = renderResume();
  else if (S.stage === 'intro') h = renderIntro();
  else if (S.stage === 'sound') h = renderSound();
  else if (S.stage === 'flow') { var f = curFlow(); h = f.t === 'sec' ? renderSection(f.sec) : renderUnit(f.u); }
  else if (S.stage === 'unclear') h = renderUnclear();
  else h = renderDone();
  app.innerHTML = h;
}

/* ===================== 응답 기록 ===================== */
function touch(no) {
  var e = Date.now() - uStart, t = S.T[no] || (S.T[no] = { first: e, last: e, n: 0 });
  t.last = e; t.n++; save();
}
function isAnswered(it) {
  var r = S.R[it.no];
  if (it.type === 'rs') return !!r && Object.keys(r).some(function (k) { return r[k]; });
  if (it.type === 'order') return !!r && r.length === it.tiles.length;
  if (it.type === 'err') return !!r && !!r.lock && !!r.s2;
  if (it.type === 'dict') return !!r && String(r).trim().length > 0;
  return !!r;
}
function serialize(it) {
  var r = S.R[it.no];
  if (it.type === 'rs') return it.words.filter(function (w) { return r && r[w]; });
  if (it.type === 'order') return (r || []).map(function (i) { return it.tiles[i]; });
  if (it.type === 'err') return r ? { s1: r.s1 || null, s2: r.s2 || null } : { s1: null, s2: null };
  return r === undefined ? null : r;
}
function responsesFor(nos) {
  return nos.map(function (no) { var t = S.T[no] || {}, it = ITEMS[no]; return { no: no, resp: serialize(it), t_first_ms: t.first, t_last_ms: t.last, changes: t.n || 0, unit_time_ms: S.U[no] }; });
}
function audioStatus() {
  var out = {}; UNITS.forEach(function (u) {
    if (u.kind === 'clip' || u.kind === 'dict') {
      var st = S.clip[u.id] || { played: 0, fails: 0, status: 'idle' };
      if (S.failed[u.id] || st.status === 'error' || st.status === 'interrupted') out[u.id] = 'failed';
      else if (st.status === 'done') out[u.id] = 'ok';
      else if (!synthOk()) out[u.id] = 'unsupported';
      else if (st.played > 0) out[u.id] = 'failed';
      else out[u.id] = 'skipped';
    }
  });
  return out;
}
function unitDone(u) {
  var elapsed = Date.now() - uStart; u.items.forEach(function (it) { S.U[it.no] = elapsed; });
  try { speechSynthesis.cancel(); } catch (e) {}
  save();
}

/* ===================== 이벤트 ===================== */
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT' && b.type === 'radio') return;
  var a = b.getAttribute('data-act'), no = +b.getAttribute('data-no'), it = ITEMS[no];
  if (a === 'begin') { begin(); return; }
  if (a === 'resume') { resumeOffer = false; uStart = Date.now(); render(); return; }
  if (a === 'restart') { lsDel(STORE); S = fresh(); resumeOffer = false; render(); return; }
  if (a === 'play') { var id = b.getAttribute('data-id'); var u = curUnit(); if (id === 'SOUND') playClip('SOUND', 'Hello. This is a sound check. If you can hear this voice, press the button that says you can hear it.', 0); else if (u) playClip(id, u.tts, u.plays); return; }
  if (a === 'failaudio') { var fid = b.getAttribute('data-id'); S.failed[fid] = true; alog(fid, 'marked_failed'); save(); refreshPlayer(fid); return; }
  if (a === 'sok') { S.sound = 'ok'; alog('SOUND', 'sound_ok'); enterFlow(); return; }
  if (a === 'sfail') { S.sound = 'failed'; alog('SOUND', 'sound_failed'); save(); render(); return; }
  if (a === 'scontinue') { alog('SOUND', 'continue_after_failed'); enterFlow(); return; }
  if (a === 'secgo') { S.pos++; uStart = Date.now(); save(); render(); window.scrollTo(0, 0); return; }
  if (a === 'rs') { var w = b.getAttribute('data-w'); S.R[no] = S.R[no] || {}; S.R[no][w] = !S.R[no][w]; touch(no); render(); return; }
  if (a === 'oadd') { S.R[no] = (S.R[no] || []).concat([+b.getAttribute('data-i')]); touch(no); render(); return; }
  if (a === 'orm') { var ps = +b.getAttribute('data-pos'); S.R[no] = (S.R[no] || []).filter(function (_, i) { return i !== ps; }); touch(no); render(); return; }
  if (a === 'oclr') { S.R[no] = []; touch(no); render(); return; }
  if (a === 'e1') { S.R[no] = S.R[no] || {}; if (!S.R[no].lock) { S.R[no].s1 = b.getAttribute('data-l'); touch(no); render(); } return; }
  if (a === 'elock') { if (S.R[no] && S.R[no].s1) { S.R[no].lock = true; touch(no); render(); } return; }
  if (a === 'next') { next(); return; }
  if (a === 'unc') return;
  if (a === 'finish') { finish(); return; }
  if (a === 'backup') { downloadBackup(); return; }
});
document.addEventListener('change', function (e) {
  var t = e.target, a = t.getAttribute && t.getAttribute('data-act');
  if (a === 'pick') { S.R[+t.getAttribute('data-no')] = t.value; touch(+t.getAttribute('data-no')); }
  else if (a === 'e2') { var n = +t.getAttribute('data-no'); S.R[n].s2 = t.value; touch(n); }
  else if (a === 'unc') { var k = +t.getAttribute('data-no'), i = S.unclear.indexOf(k); if (t.checked && i < 0) S.unclear.push(k); if (!t.checked && i >= 0) S.unclear.splice(i, 1); save(); }
});
document.addEventListener('input', function (e) {
  var t = e.target, a = t.getAttribute && t.getAttribute('data-act');
  if (a === 'dict') { var n = +t.getAttribute('data-no'); S.R[n] = t.value; touch(n); }
});
window.addEventListener('beforeunload', function (e) { if (S.stage === 'flow' || S.stage === 'unclear') { e.preventDefault(); e.returnValue = ''; } });

/* ===================== 진행 ===================== */
function begin() {
  S.code = (document.getElementById('f-code').value || '').trim().toUpperCase();
  S.grade = document.getElementById('f-grade').value;
  var g = document.querySelector('input[name=goal]:checked'), d = document.querySelector('input[name=guard]:checked');
  S.goal = g ? g.value : ''; S.guardian = d ? d.value : '';
  formErr = '';
  if (!/^P\d{3,4}$/.test(S.code)) formErr = '참가 코드를 형식에 맞게 입력하세요. (예: P001)';
  else if (!S.grade) formErr = '학년을 선택하세요.';
  else if (!S.goal) formErr = '목표 시험을 선택하세요.';
  else if (!S.guardian) formErr = '동의 확인 항목을 선택하세요.';
  else if (UNDER14.indexOf(S.grade) >= 0 && S.guardian !== 'under14') formErr = '선택한 학년은 만 14세 미만일 수 있습니다. 나이를 확인하고, 만 14세 미만이면 보호자 동의를 받은 뒤 두 번째 항목을 선택하세요.';
  if (formErr) { save(); render(); return; }
  S.stage = 'sound'; S.startedAt = new Date().toISOString(); save();
  post(Object.assign({ action: 'start', page_version: CONFIG.PAGE_VERSION, consent_version: CONFIG.CONSENT_VERSION, guardian_ack: S.guardian, grade: S.grade, goal: S.goal, sound_check: '' }, envInfo()));
  render();
}
function enterFlow() { S.stage = 'flow'; S.pos = 0; uStart = Date.now(); save(); render(); window.scrollTo(0, 0); }
function next() {
  var u = curUnit(); if (!u) return;
  var unanswered = u.items.filter(function (it) { return !isAnswered(it); }).length;
  if ((u.kind === 'clip' || u.kind === 'dict')) {
    var st = S.clip[u.id] || { played: 0, status: 'idle' };
    if (st.status === 'playing' || st.status === 'loading') { alert('음성 재생이 끝난 뒤 다음으로 넘어가 주세요.'); return; }
    if (st.played === 0 && !S.failed[u.id]) { if (!confirm('재생 버튼을 누르지 않았습니다. 듣지 않고 다음으로 넘어갈까요?')) return; alog(u.id, 'skipped_no_play'); }
  }
  if (unanswered && !confirm(unanswered + '개 문제에 답하지 않았습니다. 그대로 다음으로 넘어갈까요? (돌아올 수 없습니다)')) return;
  unitDone(u);
  var nextF = FLOW[S.pos + 1], sectionEnd = !nextF || nextF.t === 'sec';
  if (sectionEnd) {
    var nos = []; UNITS.forEach(function (x) { if (x.sec === u.sec) x.items.forEach(function (it) { nos.push(it.no); }); });
    post({ action: 'checkpoint', section: u.sec, data: { responses: responsesFor(nos), audio: S.audio.slice(-60) } });
  }
  if (!nextF) { S.stage = 'unclear'; save(); render(); window.scrollTo(0, 0); return; }
  S.pos++; uStart = Date.now(); save(); render(); window.scrollTo(0, 0);
}
function buildFinal() {
  var nos = Object.keys(ITEMS).map(Number).sort(function (a, b) { return a - b; });
  var totalMs = S.startedAt ? Date.now() - new Date(S.startedAt).getTime() : null;
  return Object.assign({ action: 'finish', page_version: CONFIG.PAGE_VERSION, consent_version: CONFIG.CONSENT_VERSION, guardian_ack: S.guardian, grade: S.grade, goal: S.goal, sound_check: S.sound, responses: responsesFor(nos), audio: S.audio, audio_status: audioStatus(), unclear: S.unclear.slice().sort(function (a, b) { return a - b; }), total_time_ms: totalMs }, envInfo());
}
async function finish() {
  if (finishing) return; finishing = true; render();
  var payload = buildFinal(); S.finalPayload = payload; save();
  var r = await post(payload);
  sendStatus = r.ok ? '완료 (서버 확인)' : r.mode === 'test' ? '테스트 모드 (서버 미설정, 이 기기에 저장됨)' : r.opaque ? '서버 응답을 확인하지 못했습니다 (재전송 대기 중)' : '실패';
  S.stage = 'done'; S.sent.finish = r.ok; save(); finishing = false; lsDel(STORE); render(); window.scrollTo(0, 0);
}
function downloadBackup() {
  var data = JSON.stringify(S.finalPayload || buildFinal(), null, 2), blob = new Blob([data], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'pilot_backup_' + S.code + '.json'; document.body.appendChild(a); a.click(); a.remove();
}

try { if (window.speechSynthesis) window.speechSynthesis.onvoiceschanged = function () {}; } catch (e) {}
flushPending();
render();
</script>
</body>
